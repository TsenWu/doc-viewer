      sheenBar.setAttribute("opacity", sk2 > 0 && sk2 < 1 ? 0.8 : 0);

      var tg = easeOut(prog(t, 9.8, 1.0));
      tagEl.setAttribute("opacity", tg);
      tagEl.setAttribute("transform", "translate(600 " + (900 + mix(40, 0, tg)) + ") scale(2.8)");
      whiteEl.style.opacity = 1 - easeOut(prog(t, 0, 0.7));
    }

    var t = 0, playing = false, last = null;

    function show() {
      renderAt(t);
    }

    function loop(ts) {
      if (playing) {
        if (last != null) {
          t = Math.min(DUR, t + (ts - last) / 1000);
        }
        last = ts;
        if (t >= DUR) {
          playing = false;
        }
        show();
        if (playing) {
          requestAnimationFrame(loop);
        }
      } else {
        last = null;
      }
    }

    function startPlay() {
      t = 0;
      playing = true;
      last = null;
      show();
      requestAnimationFrame(loop);
    }

    // 舞台點擊手動重新播放
    stage.addEventListener('click', function() {
      if (!playing) {
        startPlay();
      }
    });

    window.addEventListener('resize', function() {
      show();
    });

    // 判斷減少動態偏好
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      t = DUR;
      playing = false;
      show();
    } else {
      t = 0;
      playing = false;
      show();
      // 短暫延遲後自動播放一次，不重複播放
      setTimeout(function() {
        startPlay();
      }, 400);
    }
  })();
  </script>
</div>
